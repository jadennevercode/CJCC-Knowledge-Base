<!DOCTYPE html><html dir="ltr" lang="zh-HK" data-locale="hk"><head><meta charSet="UTF-8" data-next-head=""/><meta name="viewport" content="width=device-width, initial-scale=1.0" data-next-head=""/><meta name="robots" content="index, follow" data-next-head=""/><meta name="referrer" content="origin" data-next-head=""/><meta property="og:image" content="https://www.adata.com/images/adata_logo_1200_630.png" data-next-head=""/><meta property="og:type" content="website" data-next-head=""/><meta property="og:url" content="https://www.adata.com/hk/news/1287/" data-next-head=""/><link rel="canonical" href="https://www.adata.com/hk/news/1287/" data-next-head=""/><link rel="alternate" hrefLang="zh-TW" href="https://www.adata.com/tw/news/1287/" data-next-head=""/><link rel="alternate" hrefLang="zh-HK" href="https://www.adata.com/hk/news/1287/" data-next-head=""/><title data-next-head="">威剛寫驚奇 12月、Q4同寫歷史新高  2025年營收530億元創新猷 - 最新消息 | ADATA (Hong Kong)</title><script type="application/ld+json" data-next-head="">{"@context":"https://schema.org","@type":"Article","author":{"@Type":"Organization","name":"ADATA","url":"https://www.adata.com/hk/news/1287/"},"headline":"威剛寫驚奇 12月、Q4同寫歷史新高  2025年營收530億元創新猷","datePublished":"2026-01-06T08:00:00+08:00","image":["https://webapi3.adata.com/storage/news/revenue.png","https://webapi3.adata.com/storage/news/revenue.png"],"publisher":{"@type":"Organization","name":"ADATA","logo":{"@Type":"ImageObject","url":"https://www.adata.com/images/layout/icon/ADATA-logo.svg"}},"inLanguage":"zh-HK","articleBody":"<p>&nbsp;</p>\n<p>&nbsp; &nbsp; 受惠於記憶體市場結構性缺貨及報價跳增，記憶體模組領導品牌威剛科技12月續攀顛峰，再度繳出4大驚奇！不僅單月合併營收年增1倍達58.1億元、第四季合併營收158.71億元，同步刷新單月與單季歷史新高，12月也創下2025年第七度改寫單月同期新高紀錄；累計2025全年營收強勢突破500億元大關達530.43億元，成功締造歷史新猷。</p>\n<p>&nbsp;</p>\n<p>&nbsp; &nbsp; 回顧2025年，威剛董事長陳立白表示，自2025年第三季中旬起，AI應用對記憶體的需求量急速暴增，上游記憶體原廠的產能與供貨都優先滿足CSP大廠需求，造成記憶體市場結構性缺貨，DRAM與NAND Flash漲勢凌厲，正式開啟產業上升格局。陳立白強調，現階段上游原廠供貨非常有限，有錢也不一定能買得到貨，面對產業多頭強勢來襲，公司從去年第三季起即加速採購力道，憑藉著穩固的業界根基與策略聯盟關係，至2025年12月底已大幅拉升庫存水位，將可全力支援重要與策略性客戶的需求。</p>\n<p>&nbsp;</p>\n<p>&nbsp; &nbsp; 威剛2025年12月合併營收為58.1億元，年增101.21%、月增3.79%，單月DRAM營收貢獻為69%，SSD 21.6%，記憶卡與隨身碟與其他產品9.4%。累計2025年第四季營收季增9.54%為158.71億元，DRAM營收比重達63.54%，SSD為25.51%，記憶卡、隨身碟與其它產品占比10.95%。2025年全年營收530.43億元，年增32.48%；其中DRAM占比60.79%，SSD營收貢獻26.73%，記憶卡、隨身碟與其它產品12.48%。</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<table class=\"MsoNormalTable\" style=\"width: 576px; border-collapse: collapse; margin-left: 6.75pt; margin-right: 6.75pt;\" border=\"0\" width=\"576\" cellspacing=\"0\" cellpadding=\"0\" align=\"left\">\n<tbody>\n<tr style=\"mso-yfti-irow: 0; mso-yfti-firstrow: yes; height: 17.1pt;\">\n<td style=\"width: 534.736px; padding: 0cm 1.4pt; height: 17.1pt;\" colspan=\"6\" nowrap=\"nowrap\" width=\"576\">\n<p class=\"MsoNormal\" style=\"margin-top: .65pt; text-align: center; mso-element: frame; mso-element-frame-hspace: 9.0pt; mso-element-wrap: around; mso-element-anchor-vertical: paragraph; mso-element-anchor-horizontal: margin; mso-element-left: center; mso-element-top: 7.6pt; mso-height-rule: exactly;\" align=\"center\"><strong><span lang=\"EN-US\" style=\"font-family: '微軟正黑體',sans-serif; mso-bidi-font-family: 'Times New Roman'; color: black;\"><span style=\"mso-spacerun: yes;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;</span></span></strong>威剛<span lang=\"EN-US\">2025</span>年<span lang=\"EN-US\">12</span>月合併營收成長率<span lang=\"EN-US\">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; &nbsp; &nbsp;</span>單位：新台幣億元</p>\n</td>\n</tr>\n<tr style=\"mso-yfti-irow: 1; height: 17.85pt;\">\n<td style=\"width: 52.1321px; border: 2.25pt double black; background: rgb(204, 255, 255); padding: 0cm 1.4pt; height: 17.85pt;\" width=\"57\">\n<p class=\"MsoNormal\" style=\"text-align: center; mso-element: frame; mso-element-frame-hspace: 9.0pt; mso-element-wrap: around; mso-element-anchor-vertical: paragraph; mso-element-anchor-horizontal: margin; mso-element-left: center; mso-elem e="button"><img src="/images/share/arrow-top-white.svg" alt="back to top"/></button></div><footer class="newFooter_footer-main__Tpga_"><div class="newFooter_footer-content__uANUC"><div class="container-full newFooter_footer-menu__9dpK9"></div></div><div class="container-full newFooter_footer-legal__Cfidg"><div class="newFooter_copyright__PGO_L">Copyright© <!-- -->2026<!-- --> ADATA Technology Co., Ltd. All rights reserved.</div><div class="newFooter_footer-right__rCpzD"><div class="newFooter_footer-disclaimer-frame__U8p4Q"></div></div></div></footer></div><div id="portal"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"contentRes":{"status":"success","code":200,"message":"OK","data":{"id":1287,"tab":"finance","title":"威剛寫驚奇 12月、Q4同寫歷史新高  2025年營收530億元創新猷","top_image":"https://webapi3.adata.com/storage/news/revenue.png","cover_image":"https://webapi3.adata.com/storage/news/revenue.png","summary":"\u0026nbsp; \u0026nbsp; \u0026nbsp; 受惠於記憶體市場結構性缺貨及報價跳增，記憶體模組領導品牌威剛科技12月續攀顛峰，再度繳出4大驚奇！不僅單月合併營收年增1倍達58.1億元...","content":"\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e\u0026nbsp; \u0026nbsp; 受惠於記憶體市場結構性缺貨及報價跳增，記憶體模組領導品牌威剛科技12月續攀顛峰，再度繳出4大驚奇！不僅單月合併營收年增1倍達58.1億元、第四季合併營收158.71億元，同步刷新單月與單季歷史新高，12月也創下2025年第七度改寫單月同期新高紀錄；累計2025全年營收強勢突破500億元大關達530.43億元，成功締造歷史新猷。\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e\u0026nbsp; \u0026nbsp; 回顧2025年，威剛董事長陳立白表示，自2025年第三季中旬起，AI應用對記憶體的需求量急速暴增，上游記憶體原廠的產能與供貨都優先滿足CSP大廠需求，造成記憶體市場結構性缺貨，DRAM與NAND Flash漲勢凌厲，正式開啟產業上升格局。陳立白強調，現階段上游原廠供貨非常有限，有錢也不一定能買得到貨，面對產業多頭強勢來襲，公司從去年第三季起即加速採購力道，憑藉著穩固的業界根基與策略聯盟關係，至2025年12月底已大幅拉升庫存水位，將可全力支援重要與策略性客戶的需求。\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e\u0026nbsp; \u0026nbsp; 威剛2025年12月合併營收為58.1億元，年增101.21%、月增3.79%，單月DRAM營收貢獻為69%，SSD 21.6%，記憶卡與隨身碟與其他產品9.4%。累計2025年第四季營收季增9.54%為158.71億元，DRAM營收比重達63.54%，SSD為25.51%，記憶卡、隨身碟與其它產品占比10.95%。2025年全年營收530.43億元，年增32.48%；其中DRAM占比60.79%，SSD營收貢獻26.73%，記憶卡、隨身碟與其它產品12.48%。\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u0
